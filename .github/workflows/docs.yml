name: Deploy Sphinx Documentation

on:
  release:
    types:
      - published
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docs:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install Pyvale
        run: |
          sudo apt update
          sudo apt install libtiff-dev libtiff-tools
          sudo apt install libegl1
          sudo apt install libgl1 libglu1-mesa libxext6 libx11-6
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install documentation dependencies
        run: |
          pip install -r docs/requirements.txt
      
      - name: Setup Doxygen
        run: |
          sudo apt update
          sudo apt install -y doxygen
          cd docs/source
          doxygen Doxyfile
      
      - name: Build documentation
        run: |
          cd docs
          bash apidoc.sh
          make html
          make clean 
          make html
      
      - name: Name Pages artifact
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: 'docs/build/html'
          retention-days: 14

  deploy_pages:
    needs: build_docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build_docs.outputs.artifact_name }}
        run: |
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if available=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '[.artifacts[] | select(.expired == false)] | length') \
              && [[ "$available" == 1 ]]; then
              exit 0
            fi
          done
          echo "::error::Pages artifact $ARTIFACT_NAME is unavailable."
          echo "Retry deployment once the artifact is visible, or rebuild if it has expired."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build_docs.outputs.artifact_name }}
