name: CI

on:
  push:
    branches: [ test-github-actions ]
  pull_request:
    branches: [ test-github-actions ]
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  check-lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Lint with pylint
        run: |
          pylint src/pyvale --recursive=y . --fail-under=7.0 || echo "Pylint score is below threshold but continuing workflow"


  install:
    name: Test Installation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Test package installation
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        shell: bash

    steps:

      - name: Run Blender pytests
        run: |
          pytest -v tests/blender/.
        shell: bash


