name: Run tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel, macos-latest]
        env-type: [pip]
        include:
          - os: macos-14
            llvm: llvm@15
          - os: macos-15-intel
            llvm: llvm@18
          - os: macos-latest
            llvm: llvm@18
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set default compiler on macOS to GCC
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libegl1 libgl1 libxext6 libx11-6
          sudo apt install -y gcc-13 g++-13 || sudo apt install -y gcc-12 g++-12 || sudo apt install -y gcc-10 g++-10
          GCC_BIN=$(command -v gcc-13 || command -v gcc-12 || command -v gcc-10 || command -v gcc)
          GXX_BIN=$(command -v g++-13 || command -v g++-12 || command -v g++-10 || command -v g++)
          echo "CC=$GCC_BIN" >> $GITHUB_ENV
          echo "CXX=$GXX_BIN" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$GCC_BIN" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$GXX_BIN" >> $GITHUB_ENV

      - name: Install with pip
        if: matrix.env-type == 'pip'
        run: |
          python -m pip install --upgrade pip
          pip install -e . -v
          pip install pytest pytest-mock

      - name: Smoke test
        run: python -c "import pyvale"

      - name: Run sensorsim and DIC tests
        shell: bash -el {0}
        run: pytest -v tests/dic/. tests/sensorsim/. tests/strain/.

      - name: Run blender tests (skip macOS ARM)
        if: ${{ !startsWith(matrix.os, 'macos') || contains(matrix.os, 'intel') }}
        shell: bash -el {0}
        run: pytest -v tests/blender/
