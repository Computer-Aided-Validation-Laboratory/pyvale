name: Run tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-26]
        env-type: [pip]
        include:
          - os: macos-15
            llvm: llvm@15
          - os: macos-26
            llvm: llvm@20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Windows headless rendering dependencies
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          install-mesa3d-offscreen: true

      - name: Set default compiler on macOS to GCC
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libegl1 libgl1 libglu1-mesa libxext6 libx11-6

      - name: Install libtiff (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install libtiff

      - name: Install libtiff (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          vcpkg install tiff:x64-windows-static
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV

      - name: Install libtiff (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libtiff-dev libtiff-tools

      - name: Install with pip
        if: matrix.env-type == 'pip'
        run: |
          python -m pip install --upgrade pip
          uv pip install --system -e ".[blender]" -v
          uv pip install --system pytest pytest-mock

      - name: Smoke test
        run: python -c "import pyvale"

      - name: Run sensorsim and DIC tests
        shell: bash -el {0}
        run: pytest -v tests/dic/. tests/sensorsim/. tests/strain/.

      - name: Run render tests (skip macOS ARM)
        if: ${{ !startsWith(matrix.os, 'macos') || contains(matrix.os, 'intel') }}
        shell: bash -el {0}
        run: pytest -v tests/render/.

      - name: Run Rabbit and Gmsh integration tests and tutorials
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v tests/mooseherder tests/examples/test_mooseherder_examples.py tests/examples/test_example_navigation.py tests/docs

      - name: Run validation and data I/O tests and tutorials
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v tests/valid tests/dataio tests/examples/test_valid_examples.py
