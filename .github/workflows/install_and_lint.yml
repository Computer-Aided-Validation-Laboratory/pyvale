name: Install from source and linting

on:
  push:
    branches: [ test-github-actions ]
  pull_request:
    branches: [ test-github-actions ]
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  check-lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -e .

      - name: Lint with pylint
        run: |
          pylint src/pyvale

  install:
      name: Test Installation  ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-14]
  
      steps:
        - uses: actions/checkout@v3
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
  
        - name: Test package installation
          run: |
            python -m pip install --upgrade pip
            pip install -e .

        - name: Install LLVM and libomp on macOS
          if: (matrix.os == 'macos-13') || (matrix.os == 'macos-14')
          run: |
            brew install libomp

        - name: Set environment variables for macOS
          if: (matrix.os == 'macos-13') || (matrix.os == 'macos-14')
          run: |
            echo "CC=$(brew --prefix llvm@15)/bin/clang" >> $GITHUB_ENV
            echo "CXX=$(brew --prefix llvm@15)/bin/clang++" >> $GITHUB_ENV
            echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> $GITHUB_ENV
            echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> $GITHUB_ENV

        - name: Smoke test
          run: |
            python -c "import pyvale"

        - name: Run Blender pytests
          run: |
            pytest -v tests/blender/.
