[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0.0", "numpy>=2.0.0",
    "pybind11>=2.13.6", "scikit-build-core>=0.11.6"]
build-backend = "scikit_build_core.build"

[project]
name = "pyvale"
version = "2026.8.0"
description = "Your virtual engineering lab: An all-in-one package for sensor simulation, uncertainty quantification, sensor placement optimisation and simulation calibration or validation."
authors = [
  { name = "scepticalrabbit et al.", email = "thescepticalrabbit@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "numba>=0.60",
  "scipy>=1.14.0",
  "matplotlib>=3.8",
  "pyvista>=0.43.3",
  "vtk>=9.5.2",
  "netCDF4>=1.6.5",  
  "sympy>=1.13.0",
  "PyQT6>=6.7.1",
  "imageio>=2.36.1",
  "imageio-ffmpeg>=0.5.1",
  "pyyaml>=6.0.0",
  "pyqtgraph>=0.13.7",
  "opencv-python>=4.13.0.92",
  "pandas>=2.3.1",
  "riley-raster>=2026.8.0",
]

[project.optional-dependencies]
blender = [
  "bpy==5.1.2; python_version == '3.13'",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "Cython==3.2.3",
  "pybind11>=2.13.6",
  "scikit-build-core>=0.11.6",
  "ninja>=1.13.0",
  "sphinx",
  "babel",
  "docutils",
  "imagesize",
  "pygments",
  "snowballstemmer",
  "breathe",
  "furo",
  "alabaster",
  "myst-parser",
  "sphinx-codeautolink",
  "sphinx-copybutton",
  "sphinx-gallery",
  "sphinx-design",
  "sphinx-autodoc-typehints",
  "ipywidgets",
  "pillow",
  "sphinxcontrib-applehelp",
  "sphinxcontrib-devhelp",
  "sphinxcontrib-htmlhelp",
  "sphinxcontrib-jsmath",
  "sphinxcontrib-qthelp",
  "sphinxcontrib-serializinghtml",
  "certifi",
  "idna",
  "jinja2",
  "markupsafe",
  "packaging",
  "requests",
  "roman_numerals",
  "trame",
  "trame-vtk",
  "trame-vuetify",
  "urllib3"
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests"
]
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning"
]
markers = [
    "example: smoke test for a documented gallery example",
    "example_module(name): documented example sub-module for filtering",
    "example_slow: longer-running documented gallery example",
    "blender: requires the optional Blender renderer backend",
]

[project.urls]
"Repository" = "https://github.com/Computer-Aided-Validation-Laboratory/pyvale"
"Issue Tracker" = "https://github.com/Computer-Aided-Validation-Laboratory/pyvale/issues"

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
ninja.make-fallback = false
build-dir = "build"
wheel.packages = ["src/pyvale"]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "P30D"
